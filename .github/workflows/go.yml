name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    
jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - id: get-version
      run: echo "CURRENT_VERSION=$(awk -F= '$1 == "VERSION" { print $2; exit }' Makefile)" >> "$GITHUB_OUTPUT"
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Setup docker-compose compatibility
      run: |
        mkdir -p $HOME/bin
        echo '#!/bin/sh' > $HOME/bin/docker-compose
        echo 'exec docker compose "$@"' >> $HOME/bin/docker-compose
        chmod +x $HOME/bin/docker-compose
        echo "$HOME/bin" >> $GITHUB_PATH


    - name: Build
      run: make

    - name: Validate release artifacts
      shell: bash
      run: |
        set -euo pipefail

        version="$(awk -F= '$1 == "VERSION" { print $2; exit }' Makefile)"

        test -f "release/vinyldns_${version}_darwin_amd64.tar.gz"
        test -f "release/vinyldns_${version}_darwin_arm64.tar.gz"
        test -f "release/vinyldns_${version}_linux_amd64.tar.gz"
        test -f "release/vinyldns_${version}_linux_arm64.tar.gz"
        test -f "release/vinyldns_${version}_windows_amd64.zip"

        for archive in release/*.tar.gz; do
          test "$(tar -tzf "$archive" | wc -l)" -eq 1
          tar -tzf "$archive" | grep -Eq '^vinyldns$'
        done

        test "$(unzip -Z1 "release/vinyldns_${version}_windows_amd64.zip" | wc -l)" -eq 1
        unzip -Z1 "release/vinyldns_${version}_windows_amd64.zip" |
          grep -Eq '^vinyldns\.exe$'

        # Inspect the binaries, not just the archive names. Do not execute
        # cross-compiled binaries on the CI host.
        expected_go="go$(awk '$1 == "go" { print $2 }' go.mod)"
        expected_client="$(go list -m -f '{{.Version}}' github.com/vinyldns/go-vinyldns)"
        workdir="$(mktemp -d)"
        trap 'rm -rf "$workdir"' EXIT
        for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
          binary="$workdir/vinyldns"
          if [[ "$target" == windows_* ]]; then
            unzip -p "release/vinyldns_${version}_${target}.zip" vinyldns.exe > "$binary"
          else
            tar -xOzf "release/vinyldns_${version}_${target}.tar.gz" vinyldns > "$binary"
          fi
          metadata="$(go version -m "$binary")"
          echo "$target: $metadata"
          test "$(awk 'NR == 1 { print $NF }' <<< "$metadata")" = "$expected_go"
          test "$(awk '$1 == "dep" && $2 == "github.com/vinyldns/go-vinyldns" { print $3 }' <<< "$metadata")" = "$expected_client"
          grep -Fq "GOOS=${target%_*}" <<< "$metadata"
          grep -Fq "GOARCH=${target#*_}" <<< "$metadata"
        done

    - name: Upload release artifacts
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/upload-artifact@v4
      with:
        name: vinyldns-${{ github.sha }}
        path: release/*
        if-no-files-found: error

    - name: Create and Push Tag
      # Only create and push tag on push to the main branch
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag v${{ steps.get-version.outputs.CURRENT_VERSION }}
        git push origin v${{ steps.get-version.outputs.CURRENT_VERSION }}

    - name: Wait for tag to register
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: sleep 20
      
    - name: Create Release
      # Only create a release on push to the main branch
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: softprops/action-gh-release@v2
      with:
        name: Release v${{ steps.get-version.outputs.CURRENT_VERSION }}
        tag_name: v${{ steps.get-version.outputs.CURRENT_VERSION }}
        draft: true
        prerelease: true
        files: |
          release/*.tar.gz
          release/*.zip
